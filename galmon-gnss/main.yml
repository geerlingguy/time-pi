---
- name: Configure Galmon GNSS station.
  hosts: all
  become: true

  vars_files: ['config.yml']

  handlers:
    - name: Restart ubxtool
      ansible.builtin.systemd_service:
        name: ubxtool
        state: restarted
        daemon_reload: true

    - name: Reexec systemd
      ansible.builtin.systemd_service:
        daemon_reexec: true

  tasks:
    - name: Ensure station is configured.
      ansible.builtin.assert:
        that:
          - galmon_station | string | length > 0
          - galmon_destination | length > 0
        fail_msg: Set galmon_station and galmon_destination in config.yml.

    - name: Install build dependencies.
      ansible.builtin.apt:
        name:
          - git
          - build-essential
          - protobuf-compiler
          - libprotobuf-dev
          - libcurl4-openssl-dev
          - libssl-dev
          - libncurses-dev
          - libeigen3-dev
          - libzstd-dev
          - libfmt-dev
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Check out galmon.
      ansible.builtin.git:
        repo: "{{ galmon_repo }}"
        dest: /opt/galmon
        version: "{{ galmon_version }}"
        recursive: true

    # Incremental, so this is quick when nothing changed; the install task reports changes.
    - name: Build ubxtool and navdump.
      ansible.builtin.command: make -j{{ ansible_facts['processor_vcpus'] }} ubxtool navdump
      args:
        chdir: /opt/galmon
      changed_when: false

    - name: Install ubxtool and navdump.
      ansible.builtin.copy:
        src: "/opt/galmon/{{ item }}"
        dest: "/usr/local/bin/{{ item }}"
        remote_src: true
        mode: 0755
      loop:
        - ubxtool
        - navdump
      notify: Restart ubxtool

    - name: Configure ubxtool service.
      ansible.builtin.template:
        src: templates/ubxtool.unit.j2
        dest: /etc/systemd/system/ubxtool.service
        mode: 0644
      notify: Restart ubxtool

    - name: Ensure ubxtool is running.
      ansible.builtin.systemd_service:
        name: ubxtool
        state: started
        enabled: true
        daemon_reload: true

    - name: Ensure systemd config directory exists.
      ansible.builtin.file:
        path: /etc/systemd/system.conf.d
        state: directory
        mode: 0755

    - name: Configure hardware watchdog.
      ansible.builtin.copy:
        content: "[Manager]\nRuntimeWatchdogSec={{ galmon_watchdog_sec }}\n"
        dest: /etc/systemd/system.conf.d/watchdog.conf
        mode: 0644
      notify: Reexec systemd
