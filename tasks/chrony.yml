---
- name: Ensure only one program disciplines the system clock.
  ansible.builtin.assert:
    that: not (chrony_discipline_clock | default(false) and phc2sys_service_state == 'started')
    fail_msg: "chrony_discipline_clock is true: set phc2sys_service_state: stopped and phc2sys_service_enabled: false."

- name: Install chrony.
  ansible.builtin.apt:
    name: chrony
    state: present

- name: Customize main chrony config file.
  ansible.builtin.lineinfile:
    path: /etc/chrony/chrony.conf
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    state: present
    insertafter: EOF
  notify: Restart chrony
  loop:
    # When phc2sys owns the system clock, keep chrony from adjusting it; otherwise use chrony's defaults.
    - regexp: '^maxupdateskew.+'
      line: "maxupdateskew {{ '1000' if chrony_discipline_clock | default(false) else '0' }}"
    - regexp: '^makestep.+'
      line: "makestep {{ '1 3' if chrony_discipline_clock | default(false) else '0 0' }}"

- name: Configure chrony pool sources.
  ansible.builtin.lineinfile:
    path: /etc/chrony/chrony.conf
    regexp: '^pool\s+'
    line: "pool {{ pool }}"
    state: "{{ 'present' if pool else 'absent' }}"
  vars:
    pool: "{{ chrony_pool | default('2.debian.pool.ntp.org iburst noselect') }}"
  notify: Restart chrony

- name: Disable DHCP-provided NTP sources (they fight phc2sys for the system clock).
  ansible.builtin.replace:
    path: /etc/chrony/chrony.conf
    regexp: '^(sourcedir /run/chrony-dhcp)\s*$'
    replace: '#\1'
  notify: Restart chrony

- name: Customize other chrony configuration.
  ansible.builtin.template:
    src: "templates/{{ item }}.j2"
    dest: "/etc/chrony/conf.d/{{ item }}"
    mode: 0644
  notify: Restart chrony
  with_items:
    - allow.conf
    - refclock.conf

- name: Ensure chrony is running.
  ansible.builtin.service:
    name: chrony
    state: started
    enabled: true
