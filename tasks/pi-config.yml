---
- name: Configure overlays for i226 and GPS compatibility.
  ansible.builtin.lineinfile:
    dest: /boot/firmware/config.txt
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    state: present
  register: modify_boot_config
  with_items:
    - regexp: '^dtoverlay=pciex1-compat'
      line: "dtoverlay=pciex1-compat-pi5,mmio-hi"
    - regexp: '^dtparam=uart0'
      line: "dtparam=uart0=on"

- name: Ensure serial port is available for GPS.
  ansible.builtin.replace:
    path: /boot/firmware/cmdline.txt
    regexp: '^(.*)\b({{ item }})\b(\s+)?(.*)$'
    replace: '\1 \4'
  register: modify_cmdline_txt
  with_items:
    - "console=serial0,115200"

- name: Reboot if boot config was changed.
  ansible.builtin.reboot:
  when: >
    modify_boot_config is changed
    or modify_cmdline_txt is changed

# Only answer ARP for an IP on the interface that owns it, so eth0 and eth1 on
# the same LAN don't both claim each other's addresses ("ARP flux").
- name: Configure strict ARP.
  ansible.builtin.copy:
    content: |
      net.ipv4.conf.all.arp_ignore = 1
      net.ipv4.conf.all.arp_announce = 2
    dest: /etc/sysctl.d/90-strict-arp.conf
    mode: 0644
  when: strict_arp | default(false)
  notify: Apply strict ARP settings
