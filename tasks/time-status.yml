---
- name: Ensure time status directory exists.
  ansible.builtin.file:
    path: /opt/time-status
    state: directory
    mode: 0755

- name: Copy time status dashboard into place.
  ansible.builtin.copy:
    src: "time-status/{{ item }}"
    dest: "/opt/time-status/{{ item }}"
    mode: 0644
  notify: Restart time-status
  loop:
    - time_status.py
    - index.html

- name: Copy time status info block into place.
  ansible.builtin.copy:
    content: "{{ time_status_info | default('') }}"
    dest: /opt/time-status/info.html
    mode: 0644
  notify: Restart time-status

- name: Copy time-status systemd unit file into place.
  ansible.builtin.template:
    src: time-status.unit.j2
    dest: /etc/systemd/system/time-status.service
    owner: root
    group: root
    mode: 0644
  notify: Restart time-status

- name: Ensure time-status is running.
  ansible.builtin.systemd_service:
    name: time-status
    state: started
    enabled: true
    daemon_reload: true
