---
- name: Install GPS prerequisites.
  ansible.builtin.apt:
    name:
      - gpsd
      - gpsd-clients
      - socat
    state: present

- name: Configure gpsd.
  ansible.builtin.lineinfile:
    dest: /etc/default/gpsd
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    state: present
  notify: Restart gpsd
  with_items:
    - regexp: '^DEVICES='
      line: 'DEVICES="{{ gpsd_devices }}"'
    - regexp: '^GPSD_OPTIONS='
      line: 'GPSD_OPTIONS="{{ gpsd_options }}"'

- name: Configure gpsd service.
  ansible.builtin.service:
    name: gpsd
    state: "{{ gpsd_state }}"
    enabled: "{{ gpsd_enabled }}"

- name: Copy gpspipe-socat systemd unit file into place.
  ansible.builtin.template:
    src: gpspipe-socat.unit.j2
    dest: /etc/systemd/system/gpspipe-socat.service
    owner: root
    group: root
    mode: 0755
  notify: Restart gpspipe-socat

- name: Configure gpspipe-socat service.
  ansible.builtin.service:
    name: gpspipe-socat
    state: "{{ gpspipe_socat_state }}"
    enabled: "{{ gpspip_socat_enabled }}"

- name: Set u-blox antenna cable delay.
  when: gnss_cable_delay_ns | default('') | string | length > 0
  block:
    - name: Get u-blox protocol version.
      ansible.builtin.command: ubxtool -p MON-VER
      register: ubx_monver
      changed_when: false
      retries: 5
      delay: 3
      until: "'PROTVER=' in ubx_monver.stdout"

    - name: Save u-blox protocol version.
      ansible.builtin.set_fact:
        ubx_protver: "{{ ubx_monver.stdout | regex_search('PROTVER=([0-9.]+)', '\\1') | first }}"

    - name: Get current antenna cable delay (RAM layer).
      ansible.builtin.command: "ubxtool -P {{ ubx_protver }} -g CFG-TP-ANT_CABLEDELAY,0"
      register: ubx_cable_delay
      changed_when: false

    - name: Set antenna cable delay (saved to RAM and flash).
      ansible.builtin.command: "ubxtool -P {{ ubx_protver }} -z CFG-TP-ANT_CABLEDELAY,{{ gnss_cable_delay_ns }}"
      when: >-
        ubx_cable_delay.stdout | regex_search('ANT_CABLEDELAY\\S* val (-?[0-9]+)', '\\1') | first | int
        != gnss_cable_delay_ns | int
      changed_when: true
