---
- name: Generate WireGuard keys.
  hosts: ntp_proxy:time_pi
  become: true

  tasks:
    - name: Install WireGuard tools.
      ansible.builtin.apt:
        name: wireguard-tools
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Ensure WireGuard config directory is private.
      ansible.builtin.file:
        path: /etc/wireguard
        state: directory
        mode: 0700

    # Each private key is generated on its own host and never leaves it.
    - name: Generate WireGuard private key.
      ansible.builtin.shell: umask 077 && wg genkey > /etc/wireguard/privatekey
      args:
        creates: /etc/wireguard/privatekey

    - name: Read WireGuard public key.
      ansible.builtin.shell: wg pubkey < /etc/wireguard/privatekey
      register: wg_pubkey
      changed_when: false

- name: Configure NTP proxy server.
  hosts: ntp_proxy
  become: true

  vars:
    security_autoupdate_reboot: "false"
    firewall_disable_ufw: true
    # 80 is for Let's Encrypt's HTTP challenge, only listened on by certbot; 4460 is NTS key exchange.
    firewall_allowed_tcp_ports: "{{ ['22'] + (['80', '4460'] if nts_enabled else []) }}"
    certbot_create_if_missing: true
    certbot_create_standalone_stop_services: []
    certbot_auto_renew_user: root
    certbot_certs:
      - domains: ["{{ inventory_hostname }}"]
    firewall_allowed_udp_ports: ["123", "{{ wg_port }}"]
    # Don't track NTP clients in conntrack, so heavy pool traffic can't fill the table.
    firewall_additional_rules:
      - iptables -t raw -F
      - iptables -t raw -A PREROUTING -p udp --dport 123 -j CT --notrack
      - iptables -t raw -A OUTPUT -p udp --sport 123 -j CT --notrack
    firewall_ip6_additional_rules:
      - ip6tables -t raw -F
      - ip6tables -t raw -A PREROUTING -p udp --dport 123 -j CT --notrack
      - ip6tables -t raw -A OUTPUT -p udp --sport 123 -j CT --notrack

  roles:
    - geerlingguy.security
    - geerlingguy.firewall

  handlers:
    - name: Restart WireGuard
      ansible.builtin.service:
        name: wg-quick@wg0
        state: restarted

    - name: Restart chrony
      ansible.builtin.service:
        name: chrony
        state: restarted

  tasks:
    - name: Configure WireGuard.
      ansible.builtin.template:
        src: templates/wg0-proxy.conf.j2
        dest: /etc/wireguard/wg0.conf
        mode: 0600
      notify: Restart WireGuard

    - name: Ensure WireGuard is running.
      ansible.builtin.service:
        name: wg-quick@wg0
        state: started
        enabled: true

    - name: Install chrony, cron and vnstat.
      ansible.builtin.apt:
        name:
          - chrony
          - cron
          - vnstat
        state: present

    - name: Set up NTS certificate.
      when: nts_enabled
      block:
        - name: Ensure certbot deploy hook directory exists.
          ansible.builtin.file:
            path: /etc/letsencrypt/renewal-hooks/deploy
            state: directory
            mode: 0755

        - name: Install certbot deploy hook for chrony.
          ansible.builtin.copy:
            src: files/chrony-nts-certs.sh
            dest: /etc/letsencrypt/renewal-hooks/deploy/chrony-nts-certs
            mode: 0755

        - name: Get certificate from Let's Encrypt.
          ansible.builtin.include_role:
            name: geerlingguy.certbot

        - name: Copy certificate for chrony.
          ansible.builtin.command: /etc/letsencrypt/renewal-hooks/deploy/chrony-nts-certs
          args:
            creates: /etc/chrony/nts/fullchain.pem
          environment:
            RENEWED_LINEAGE: "/etc/letsencrypt/live/{{ inventory_hostname }}"

    - name: Configure chrony.
      ansible.builtin.template:
        src: templates/chrony.conf.j2
        dest: /etc/chrony/chrony.conf
        mode: 0644
      notify: Restart chrony

    - name: Ensure chrony is running.
      ansible.builtin.service:
        name: chrony
        state: started
        enabled: true

    # chrony's logrotate config covers /var/log/chrony/*.log.
    - name: Log chrony server stats every minute.
      ansible.builtin.cron:
        name: chrony serverstats
        cron_file: chrony-serverstats
        user: root
        job: 'echo "$(date -u +\%FT\%TZ),$(chronyc -c serverstats)" >> /var/log/chrony/serverstats.log'

    - name: Install ntp-stats script.
      ansible.builtin.copy:
        src: files/ntp_stats.py
        dest: /usr/local/bin/ntp-stats
        mode: 0755

    - name: Install chronytop dashboard.
      ansible.builtin.include_tasks: ../tasks/chronytop.yml

- name: Connect Time Pi to NTP proxy server.
  hosts: time_pi
  become: true

  handlers:
    - name: Restart WireGuard
      ansible.builtin.service:
        name: wg-quick@wg0
        state: restarted

    - name: Restart chrony
      ansible.builtin.service:
        name: chrony
        state: restarted

  tasks:
    - name: Install nftables.
      ansible.builtin.apt:
        name: nftables
        state: present

    - name: Copy WireGuard tunnel firewall rules.
      ansible.builtin.copy:
        src: files/wg0.nft
        dest: /etc/wireguard/wg0.nft
        mode: 0600
      notify: Restart WireGuard

    - name: Configure WireGuard.
      ansible.builtin.template:
        src: templates/wg0-pi.conf.j2
        dest: /etc/wireguard/wg0.conf
        mode: 0600
      notify: Restart WireGuard

    - name: Ensure WireGuard is running.
      ansible.builtin.service:
        name: wg-quick@wg0
        state: started
        enabled: true

    - name: Allow NTP proxy server to query chrony.
      ansible.builtin.copy:
        content: "allow {{ wg_proxy_address }}\n"
        dest: /etc/chrony/conf.d/ntp-proxy.conf
        mode: 0644
      notify: Restart chrony
