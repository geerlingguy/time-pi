---
- name: Configure time pi.
  hosts: all
  become: true

  vars_files: ['config.yml']

  handlers:
    - name: Include various service handlers.
      ansible.builtin.import_tasks: handlers/main.yml

  pre_tasks:
    - name: Update apt cache.
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 1800

    - name: Upgrade OS packages.
      ansible.builtin.include_tasks: tasks/apt-upgrade.yml
      when: apt_upgrade_enabled | default(false)

  tasks:
    - name: Configure Raspberry Pi settings.
      ansible.builtin.include_tasks: tasks/pi-config.yml

    - name: Configure i226 Ethernet interface.
      ansible.builtin.include_tasks: tasks/i226.yml
      when: i226_force_1gbps

    - name: Install TimeHAT i226 PPS driver.
      ansible.builtin.include_tasks: tasks/timehat-igc.yml
      when: timehat_igc_driver_enabled | default(false)

    - name: Configure GPS.
      ansible.builtin.include_tasks: tasks/gps.yml

    - name: Configure PTP.
      ansible.builtin.include_tasks: tasks/ptp.yml

    - name: Configure chrony.
      ansible.builtin.include_tasks: tasks/chrony.yml

    - name: Finalize Time Pi setup.
      ansible.builtin.include_tasks: tasks/finalize.yml
      when: final_reboot_enabled | default(false)
